[build]
  command = "npm run build"
  publish = "dist"

# Serve the bespoke "not found" pages for unknown resource / spotlight URLs,
# mirroring Gatsby's /resources/* and /spotlights/* matchPath fallbacks.
# force is false by default, so real pages are still served directly.
[[redirects]]
  from = "/resources/*"
  to = "/resources/404/index.html"
  status = 404

[[redirects]]
  from = "/spotlights/*"
  to = "/spotlights/404/index.html"
  status = 404
